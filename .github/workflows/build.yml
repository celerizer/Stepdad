name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

env:
  QT_VERSION: '6.8.3'

jobs:
  linux:
    name: Linux (AppImage)
    # Build on the oldest supported runner so the AppImage runs on older distros
    runs-on: ubuntu-22.04

    steps:
    - uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y libgl1-mesa-dev libxkbcommon-x11-0 libxcb-cursor0 \
          libxcb-icccm4 libxcb-image0 libxcb-keysyms1 libxcb-randr0 \
          libxcb-render-util0 libxcb-shape0 libxcb-xinerama0 libfuse2

    - name: Install Qt
      uses: jurplel/install-qt-action@v4
      with:
        version: ${{ env.QT_VERSION }}
        host: linux
        target: desktop
        arch: linux_gcc_64
        modules: qtmultimedia
        cache: true

    - name: Build
      run: |
        mkdir build && cd build
        qmake ../Stepdad.pro CONFIG+=release
        make -j$(nproc)

    - name: Package AppImage
      run: |
        wget -q https://github.com/linuxdeploy/linuxdeploy/releases/download/continuous/linuxdeploy-x86_64.AppImage
        wget -q https://github.com/linuxdeploy/linuxdeploy-plugin-qt/releases/download/continuous/linuxdeploy-plugin-qt-x86_64.AppImage
        chmod +x linuxdeploy*.AppImage

        cat > stepdad.desktop <<'DESKTOP'
        [Desktop Entry]
        Type=Application
        Name=Stepdad
        Comment=H8/300H pedometer emulator
        Exec=Stepdad
        Icon=stepdad
        Categories=Game;Emulator;
        DESKTOP
        sed -i 's/^ *//' stepdad.desktop
        cp assets/icon.png stepdad.png

        export QMAKE=$(which qmake)
        export EXTRA_QT_MODULES="multimedia"
        export OUTPUT=Stepdad-x86_64.AppImage
        ./linuxdeploy-x86_64.AppImage --appdir AppDir \
          --executable build/Stepdad \
          --desktop-file stepdad.desktop \
          --icon-file stepdad.png \
          --plugin qt \
          --output appimage

    - uses: actions/upload-artifact@v4
      with:
        name: Stepdad-linux-x86_64
        path: Stepdad-x86_64.AppImage

  windows:
    name: Windows
    runs-on: windows-2022

    steps:
    - uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: Install Qt
      uses: jurplel/install-qt-action@v4
      with:
        version: ${{ env.QT_VERSION }}
        host: windows
        target: desktop
        arch: win64_msvc2022_64
        modules: qtmultimedia
        cache: true

    - name: Set up MSVC
      uses: ilammy/msvc-dev-cmd@v1

    - name: Build
      shell: cmd
      run: |
        mkdir build
        cd build
        qmake ..\Stepdad.pro CONFIG+=release
        nmake

    - name: Deploy
      shell: cmd
      run: |
        mkdir dist
        copy build\release\Stepdad.exe dist\
        windeployqt --release --no-translations dist\Stepdad.exe

    - uses: actions/upload-artifact@v4
      with:
        name: Stepdad-windows-x64
        path: dist
